<svg viewBox="0 0 260 210" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- ══════════════════════════════════════════════════════════════════
       DEVLYNCS — "DL" monogram (cooled-up)
       Chamfered geometric D + L, chromed teal gradient, bevel highlight,
       inner shadow + soft outer glow. No lynx, no wordmark.
       ══════════════════════════════════════════════════════════════════ -->
  <defs>
    <!-- Main brushed-metal teal fill -->
    <linearGradient id="dl-metal" x1="0" y1="0" x2="0.25" y2="1">
      <stop offset="0%"   stop-color="#eafaf6"/>
      <stop offset="22%"  stop-color="#9fd8cd"/>
      <stop offset="48%"  stop-color="#2bb3a3"/>
      <stop offset="72%"  stop-color="#0d9488"/>
      <stop offset="100%" stop-color="#075a52"/>
    </linearGradient>
    <!-- Bright top bevel highlight -->
    <linearGradient id="dl-edge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#ffffff"/>
      <stop offset="45%"  stop-color="#cdeee7"/>
      <stop offset="100%" stop-color="#3a8f85"/>
    </linearGradient>
    <!-- Diagonal sheen sweep -->
    <linearGradient id="dl-sheen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="22%"  stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="70%"  stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="88%"  stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <!-- Soft outer glow -->
    <filter id="dl-glow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="3" stdDeviation="5"
                    flood-color="#0d9488" flood-opacity="0.45"/>
    </filter>
    <!-- Inner shading for depth -->
    <filter id="dl-inner" x="-20%" y="-20%" width="140%" height="140%">
      <feOffset dx="0" dy="-3" in="SourceAlpha" result="o"/>
      <feGaussianBlur in="o" stdDeviation="3" result="b"/>
      <feComposite in="b" in2="SourceAlpha" operator="arithmetic"
                   k2="-1" k3="1" result="sh"/>
      <feColorMatrix in="sh" type="matrix"
        values="0 0 0 0 0.01  0 0 0 0 0.28  0 0 0 0 0.25  0 0 0 0.5 0"/>
    </filter>
  </defs>

  <g filter="url(#dl-glow)">
    <!-- ── D ──────────────────────────────────────────────────────── -->
    <path id="dl-d"
      d="M 28 30
         L 116 30
         C 158 30 186 60 186 105
         C 186 150 158 180 116 180
         L 28 180
         L 28 158
         L 48 138
         L 48 72
         L 28 52
         Z
         M 68 64
         L 68 146
         L 110 146
         C 134 146 150 128 150 105
         C 150 82 134 64 110 64
         Z"
      fill="url(#dl-metal)" fill-rule="evenodd"/>

    <!-- ── L ──────────────────────────────────────────────────────── -->
    <path id="dl-l"
      d="M 178 30
         L 220 30
         L 220 52
         L 208 64
         L 208 146
         L 254 146
         L 254 158
         L 240 180
         L 178 180
         Z"
      fill="url(#dl-metal)"/>
  </g>

  <!-- Inner-shadow pass for carved depth -->
  <use href="#dl-d" filter="url(#dl-inner)"/>
  <use href="#dl-l" filter="url(#dl-inner)"/>

  <!-- Diagonal sheen overlay -->
  <use href="#dl-d" fill="url(#dl-sheen)"/>
  <use href="#dl-l" fill="url(#dl-sheen)"/>

  <!-- Crisp bevel edge stroke on top -->
  <use href="#dl-d" fill="none" stroke="url(#dl-edge)" stroke-width="2.5" stroke-linejoin="round"/>
  <use href="#dl-l" fill="none" stroke="url(#dl-edge)" stroke-width="2.5" stroke-linejoin="round"/>
</svg>
